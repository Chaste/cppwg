# Package name: prepended to all modules.
name: pyshapes

# Smart pointer type for PYBIND11_DECLARE_HOLDER_TYPE in all wrappers.
smart_ptr_type: std::shared_ptr

# Default value of pybind11::return_value_policy for pointers.
pointer_call_policy: reference

# Default value of pybind11::return_value_policy for references.
reference_call_policy: reference_internal

# Set False to not include the common include file (all headers) in all wrappers.
common_include_file: True

# Headers to include in all wrappers.
source_includes:
  - <memory>

# Exclude default arguments from wrapped methods.
exclude_default_args: False

# C++ exception classes to translate into Python exceptions. cppwg generates a
# pybind11 exception translator for each, so C++ exceptions surface as Python
# exceptions instead of terminating the interpreter. message_method is the
# accessor used for the message text; it defaults to "what".
exceptions:
  - name: ShapeException
    message_method: GetMessage

# Type-caster headers to auto-include per class wrapper. When a wrapped class's
# method/constructor signatures use one of an entry's `types`, cppwg adds that
# entry's `header` to that class's wrapper .cpp. Spell each type as it appears
# in the signature: a whole token, case-sensitive, namespace-qualified where
# relevant.
# See examples/cells for a working example. (pyshapes needs no type-casters.)
# typecasters:
#   - header: caster_petsc.h
#     types: [Vec, Mat]
#   - header: PybindVTKTypeCaster.h
#     types: [vtkSmartPointer]
#   - header: PybindUblasTypeCaster.hpp
#     types: [boost::numeric::ublas::c_vector]

# Signature/replacement settings for explicit template instantiations.
template_substitutions:
  - signature: <unsigned DIM>
    replacement: [[2], [3]]
  - signature: <unsigned ELEMENT_DIM, unsigned SPACE_DIM=ELEMENT_DIM>
    replacement: [[2, 2], [3, 3]]

# As an alternative to template_substitutions, cppwg can discover the explicit
# template instantiations (e.g. `template class Foo<2>;`) directly from the C++
# implementation files. Set discover_template_instantiations at any level
# (package, module or class) to enable it for the classes below; it is used as a
# fallback for any templated class that no template_substitutions matched. See
# examples/cells for a working example.
# discover_template_instantiations: True

# Drop discovered instantiations you do not want to wrap (e.g. everything the
# source instantiates at a spatial dimension of 1). Maps a template parameter
# name to the argument values to exclude; a discovered instantiation is dropped
# when the argument bound to a listed parameter is one of its values. Matching is
# by parameter name, so a trailing non-spatial 1 (e.g. a PROBLEM_DIM) in
# Foo<2, 2, 1> is kept. Only discovered instantiations are filtered;
# template_substitutions are always wrapped as written.
# discover_arg_excludes:
#   DIM: [1]
#   ELEMENT_DIM: [1]
#   SPACE_DIM: [1]

# Implementation file patterns scanned for explicit template instantiations when
# discover_template_instantiations is enabled. Defaults to ["*.cpp"].
# source_cpp_patterns:
#   - "*.cpp"

modules:
  # Module name
  - name: math_funcs

    # List of source directories for this module relative to the source root.
    # Restrict to headers from these directories. Blank means unrestricted.
    source_locations:

    # List of classes to wrap. Blank means none, CPPWG_ALL means discover all.
    classes:

    # List of free functions to wrap. Blank means none, CPPWG_ALL means discover all.
    free_functions: CPPWG_ALL

  - name: geometry
    source_locations:
      - geometry

    classes:
      # Name of class.
      - name: Point

        # Name of class source file. Not required if class name matches file name.
        source_file: Point.hpp

        # Optional path to the class source file, relative to the source root.
        # source_file_path: geometry/Point.hpp

        source_includes:
          - <map>

        # Automatically add includes for the project types this class's wrapped
        # signatures use, when its own header only forward-declares them (so you
        # don't have to list them under source_includes). Only project types
        # (classes under the module source_locations) are resolved; library types
        # are left alone. Off by default; inherits down package/module/class. No
        # effect with common_include_file. See examples/cells (MeshFactory).
        # auto_includes: True

        # List of methods that should not be wrapped.
        excluded_methods:
          - ExcludedMethod

        # Exclude any method or constructor with an argument of these types.
        # Patterns match a type as a whole token (so "Node" won't match
        # "AbstractNode").
        # arg_type_excludes:
        #   - double

        # Exclude any method returning these types.
        # return_type_excludes:
        #   - double

        # Exclude constructors (only) with an argument of these types, when a
        # type should be excluded from constructors but not methods.
        # constructor_arg_type_excludes:
        #   - double

        # Exclude any constructors that have these signatures.
        constructor_signature_excludes:
          - [int, int, int]

        # Path to a custom script for generating wrappers for this class.
        # The custom generator must extend cppwg.templates.custom.Custom.
        # CPPWG_SOURCEROOT can be used in the path for the source root directory.
        # custom_generator: "CPPWG_SOURCEROOT/point_generator.py"

        # Custom C++ code to place at the top of the class wrapper.
        # prefix_code:

        # Custom C++ code to place at the bottom of the class wrapper.
        # suffix_code:

  - name: primitives
    # Shape (and its subclasses) use Point, which is wrapped in the `geometry`
    # module, e.g. as the default argument of Shape::AddVertex. Importing the
    # geometry module ensures Point is registered before this module loads,
    # regardless of the order in which the modules are first imported.
    imports:
      - pyshapes.geometry._pyshapes_geometry
    # RegularPolygon overrides virtuals that its abstract bases (AbstractShape /
    # AbstractPolygon) already bind. With this set on the module, cppwg skips
    # those redundant inherited-override bindings.
    exclude_inherited_overrides: True
    source_locations:
    classes:
      - name: AbstractShape
      - name: AbstractPolygon
      - name: RegularPolygon
      - name: Cuboid
      - name: Rectangle
      - name: Shape
      - name: Triangle
        excluded: True # Exclude this class from wrapping.

  - name: composites
    # The Square class wrapped in this module inherits from Rectangle, which is
    # wrapped in the separate `primitives` module. List the module that
    # registers Rectangle under `imports` so that cppwg references Rectangle as
    # an external base class and imports its module before registering Square.
    imports:
      - pyshapes.primitives._pyshapes_primitives
    source_locations:
    classes:
      - name: Square

# Text to add at the top of all wrappers
prefix_text: |
  // This file is automatically generated by cppwg.
  // Do not modify this file directly.
