# For docs on config options, see examples/shapes/wrapper/package_info.yaml
name: pycells

smart_ptr_type: std::shared_ptr
pointer_call_policy: reference
reference_call_policy: reference_internal

common_include_file: False
source_includes:
  - <memory>

exclude_default_args: False

# Discover explicit template instantiations (e.g. `template class Node<2>;`) from
# the source .cpp files, instead of hand-writing template_substitutions for each
# templated class below.
discover_template_instantiations: True

# C++ exception classes to translate into Python exceptions. cppwg generates a
# pybind11 exception translator for each, so C++ exceptions surface as Python
# exceptions instead of terminating the interpreter. message_method is the
# accessor used for the message text; it defaults to "what".
exceptions:
  - name: SimulationException
    message_method: GetMessage

# Type-caster headers to auto-include per class wrapper. When a wrapped class's
# method/constructor signatures use one of an entry's `types`, cppwg adds that
# entry's `header` to the class's wrapper .cpp. `types` must match the C++ type
# as it appears in signatures.
typecasters:
  - header: PybindUblasTypeCaster.hpp
    types: [boost::numeric::ublas::c_vector]
  - header: caster_petsc.h
    types: [Vec, Mat]
  - header: PybindVTKTypeCaster.h
    types: [vtkSmartPointer]

modules:
  - name: all
    source_locations:
      - cell
      - mesh
      - utils
      - visualization

    classes:
      # cell
      - name: Cell

      # mesh
      - name: AbstractMesh

      # Facet<DIM> references its faces Facet<DIM-1> only through pointers, and
      # Facet<0> is never instantiated (see Facet.cpp). Wrapping Facet<2> is
      # safe (its faces Facet<1> are instantiated). This substitution curates
      # to <2>; removing it lets discovery also wrap Facet<1>, whose GetFace
      # returns the never-instantiated Facet<0> - producing an
      # "undefined symbol: Facet<0>::~Facet" ImportError.
      - name: Facet
        template_substitutions:
          - signature: <unsigned DIM>
            replacement: [[2]]

      # Corner<DIM> is structurally identical to Facet (Corner<0> is never
      # instantiated), but resolved automatically instead of curated. With no
      # template_substitutions, discovery finds Corner<1> and Corner<2>, and
      # cppwg auto-drops Corner<1> (whose GetSub returns the never-instantiated
      # Corner<0>), leaving the safe Corner<2> wrapped. This is the non-curated
      # counterpart to Facet's hand-written [[2]] curation above.
      - name: Corner

      # Instantiated via a macro (see MacroMesh.cpp); discovered by the
      # pygccxml fallback since the source-text scan cannot expand macros.
      - name: MacroMesh

      - name: MeshFactory
        source_includes:
          - PottsMesh.hpp

      - name: Node

      - name: PottsMesh

      # utils
      - name: PetscUtils

      # visualization
      - name: Scene

prefix_text: |
  // This file is auto-generated by cppwg; manual changes will be overwritten.
