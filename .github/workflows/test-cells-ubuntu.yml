name: test-cells-ubuntu

on:
  workflow_dispatch:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - "**"

jobs:
  test-cells-ubuntu:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04"]

    container:
      image: ${{ matrix.image }}

    concurrency:
      group: test-cells-ubuntu-${{ github.ref }}-${{ matrix.image }}
      cancel-in-progress: true

    defaults:
      run:
        shell: bash -el {0} # -l needed to activate pipx

    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y git

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set git safe directory
        run: |
          git config --global --add safe.directory $PWD

      - name: Get system VTK version
        run: |
          vtk_ver=
          for candidate in $(seq 7 99); do
            vtk_pkg="$(apt-cache search --names-only ^libvtk${candidate}-dev$)"
            if [ -n "${vtk_pkg}" ]; then
              vtk_ver="${candidate}"
              break
            fi
          done
          echo "VTK version: ${vtk_ver}"
          echo "VTK_VERSION=${vtk_ver}" >> $GITHUB_ENV

      - name: Install system dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y \
            castxml \
            clang \
            cmake \
            libboost-all-dev \
            libpetsc-real-dev \
            libvtk${{ env.VTK_VERSION }}-dev \
            mpi-default-bin \
            mpi-default-dev \
            pipx \
            python3-mpi4py \
            python3-petsc4py-real \
            python3-pip \
            python3-vtk${{ env.VTK_VERSION }}

          pipx ensurepath

      - name: Use newer CastXML on Ubuntu 22.04
        # Ubuntu 22.04 ships CastXML 0.4.4, which drops a defaulted trailing
        # template argument from an instantiation's name (e.g. MacroMesh<2, 2>
        # -> MacroMesh<2>). Install CastXML 0.6.x from the CastXMLSuperbuild
        # release binaries so macro-declared instantiations of a class with a
        # defaulted template argument are discovered correctly (see the
        # MacroMesh class in examples/cells).
        if: matrix.image == 'ubuntu:22.04'
        run: |
          apt-get install -y curl
          curl -sL https://github.com/CastXML/CastXMLSuperbuild/releases/download/v0.6.5/castxml-linux.tar.gz \
            | tar -xz -C /opt
          /opt/castxml/bin/castxml --version
          echo "/opt/castxml/bin" >> "$GITHUB_PATH"

      - name: Check installed package versions
        run: |
          dpkg-query -W \
            castxml \
            clang \
            cmake \
            git \
            libboost-all-dev \
            libpetsc-real-dev \
            libvtk${{ env.VTK_VERSION }}-dev \
            mpi-default-bin \
            mpi-default-dev \
            pipx \
            python3-mpi4py \
            python3-petsc4py-real \
            python3-pip \
            python3-vtk${{ env.VTK_VERSION }}

      - name: Install cppwg
        run: pipx install .

      - name: Configure
        run: |
          mkdir build && cd build
          cmake ..
        working-directory: examples/cells

      - name: Regenerate wrappers
        run: |
          rm -rf dynamic/wrappers
          cd build
          make pycells_wrappers
        working-directory: examples/cells

      - name: Check for changes
        run: |
          git diff --exit-code dynamic/wrappers
          grep "Unknown class" build/cppwg.log
        working-directory: examples/cells

      - name: Create build env
        run: |
          python3 -m venv --system-site-packages .venv
          . .venv/bin/activate && \
          python3 -m pip install --upgrade pip
        working-directory: examples/cells

      - name: Build
        # Don't use pip build isolation because CMake cannot find_package(PETSc4py).
        # The system petsc4py is exposed via the --system-site-packages venv but
        # build isolation is tightened in newer versions of pip and prevents the
        # build from seeing it. The --no-build-isolation flag requires installing
        # the build dependencies directly: scikit-build-core and ninja (these
        # would normally be pip-fetched during an isolated build).
        run: |
          . .venv/bin/activate && \
          python3 -m pip install "scikit-build-core >= 0.10.0" ninja && \
          python3 -m pip install -v --no-build-isolation .
        working-directory: examples/cells

      - name: Test
        run: |
          . .venv/bin/activate && \
          python3 -m unittest discover tests
        working-directory: examples/cells
