name: test-shapes-pip

on:
  workflow_dispatch:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - "**"

jobs:
  test-shapes-pip:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    concurrency:
      group: test-shapes-pip-${{ github.ref }}-${{ matrix.python-version }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y castxml clang cmake git

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install cppwg
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e . coverage

      - name: Regenerate wrappers
        run: |
          rm -rf wrapper/*/
          python3 -m coverage run --source=cppwg -m cppwg src/cpp \
            --wrapper_root wrapper/ \
            --package_info wrapper/package_info.yaml \
            --includes src/cpp/*/ \
            --std c++17 \
            --logfile cppwg.log
        working-directory: examples/shapes

      - name: Check for changes
        run: |
          git diff --exit-code wrapper
          grep "Unknown class" cppwg.log
        working-directory: examples/shapes

      - name: Generate coverage report
        if: matrix.python-version == '3.12'
        run: python3 -m coverage xml
        working-directory: examples/shapes

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./examples/shapes/coverage.xml
          flags: shapes
          fail_ci_if_error: false

      - name: Configure
        run: |
          mkdir build && cd build
          cmake ..
        working-directory: examples/shapes

      - name: Build
        run: make -j $(nproc)
        working-directory: examples/shapes/build

      - name: Test
        run: |
          python3 -m unittest test_functions.py
          python3 -m unittest test_classes.py
        working-directory: examples/shapes/build
