# Codecov configuration.
#
# Coverage (issue #20) sits at ~99% and is held there by the ratchet below:
# the project status may not drop, and every patch must be fully covered so new
# code keeps the total high. The small remainder is unreachable defensive code
# and one-way/loop-back branch halves that are not worth contriving inputs for;
# they are left uncovered rather than hidden behind coverage pragmas.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0.5%
    patch:
      default:
        target: 100%

# Coverage is uploaded from several jobs, each with its own flag: unit (the
# pytest suite), shapes and cells (real generator runs on the example projects).
# Codecov merges them per commit. carryforward keeps a flag's last coverage when
# its job does not run on a given commit, so the combined total stays stable.
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: unit
    - name: shapes
    - name: cells

comment:
  layout: "reach, diff, flags, files"
  require_changes: true
