# Codecov configuration.
#
# Goal (issue #20): reach 100% coverage incrementally. Until then the project
# status ratchets - coverage may not drop - while every patch must be fully
# covered, so new code keeps the total moving toward 100%. Flip the project
# target to 100% once it is reached.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0.5%
    patch:
      default:
        target: 100%

# Coverage is uploaded from several jobs, each with its own flag: unit (the
# pytest suite), shapes and cells (real generator runs on the example projects).
# Codecov merges them per commit. carryforward keeps a flag's last coverage when
# its job does not run on a given commit, so the combined total stays stable.
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: unit
    - name: shapes
    - name: cells

comment:
  layout: "reach, diff, flags, files"
  require_changes: true
